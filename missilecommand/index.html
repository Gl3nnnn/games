<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missile Command - Neon Arcade</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-btn">← BACK</a>
        <h1 class="game-title">MISSILE COMMAND</h1>

        <div class="score-display">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH SCORE: <span id="highScore">0</span></div>
            <div>WAVE: <span id="wave">1</span></div>
            <div>CITIES: <span id="cities">6</span></div>
        </div>

        <canvas id="gameCanvas" width="560" height="440"></canvas>

        <div class="controls-info">
            <p><span>MOVE MOUSE</span> to aim, <span>CLICK</span> to launch a counter-missile</p>
            <p>Protect your cities! <span>P</span> pause</p>
        </div>

        <div id="gameOver" class="overlay hidden">
            <h2>CITIES DESTROYED</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">PLAY AGAIN</button>
        </div>

        <div id="startScreen" class="overlay start-screen">
            <h2>CLICK TO START</h2>
        </div>
    </div>
    <script src="../arcade.js"></script>
    <script src="game.js"></script>
</body>
</html>
