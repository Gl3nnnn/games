<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JezzBall - Neon Arcade</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-btn">← BACK</a>
        <h1 class="game-title">JEZZBALL</h1>

        <div class="score-display">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH SCORE: <span id="highScore">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="440" height="360"></canvas>

        <div class="controls-info">
            <p><span>ARROW KEYS</span> to move &middot; <span>SPACE</span> to seal a line</p>
            <p>Seal the bouncing balls into smaller zones - don't get crossed!</p>
        </div>

        <div id="gameOver" class="overlay hidden">
            <h2>GAME OVER</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">PLAY AGAIN</button>
        </div>

        <div id="pauseOverlay" class="overlay hidden">
            <h2>PAUSED</h2>
            <p>Press <span>P</span> to resume</p>
        </div>

        <div id="startScreen" class="overlay start-screen">
            <h2>PRESS ANY KEY TO START</h2>
        </div>
    </div>
    <script src="../arcade.js" data-dpad="1"></script>
    <script src="game.js"></script>
</body>
</html>
