<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame - Neon Arcade</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="records.css">
</head>
<body>
    <div class="records-container">
        <a href="index.html" class="back-btn">← BACK TO ARCADE</a>
        <h1 class="title">🏆 HALL OF FAME</h1>
        <p class="subtitle">Top 5 legends of every machine</p>

        <div id="groups"></div>

        <div class="actions">
            <button id="clearBtn" class="action-btn danger">🗑 CLEAR ALL RECORDS</button>
            <a href="index.html" class="action-btn">🕹️ BACK TO GAMES</a>
        </div>
    </div>
    <script src="arcade.js"></script>
    <script>
    (function () {
        var GAMES = [
            { g: 'CLASSIC', id: 'snake', name: 'SNAKE', legacy: 'snakeHighScore' },
            { g: 'CLASSIC', id: 'breakout', name: 'BREAKOUT', legacy: 'breakoutHighScore' },
            { g: 'CLASSIC', id: 'pacman', name: 'PAC-MAN', legacy: 'pacmanHighScore' },
            { g: 'CLASSIC', id: 'flappy', name: 'FLAPPY NEON', legacy: 'flappyHighScore' },
            { g: 'CLASSIC', id: 'pong', name: 'PONG (WINS)', legacy: 'pongHighScore' },
            { g: 'CLASSIC', id: 'frogger', name: 'FROGGER', legacy: 'froggerHighScore' },
            { g: 'CLASSIC', id: 'balloonPop', name: 'BALLOON POP', legacy: 'balloonPopHighScore' },
            { g: 'CLASSIC', id: 'spaceDodger', name: 'SPACE DODGER', legacy: 'spaceDodgerHighScore' },
            { g: 'CLASSIC', id: 'endlessRunner', name: 'ENDLESS RUNNER', legacy: 'endlessRunnerHighScore' },
            { g: 'CLASSIC', id: 'catcher', name: 'CATCHER', legacy: 'catcherHighScore' },
            { g: 'CLASSIC', id: 'blockdrop', name: 'BLOCK DROP', legacy: 'blockdropHighScore' },
            { g: 'PUZZLE & MIND', id: 'maze', name: 'MAZE ESCAPE', legacy: 'mazeBestTime', lb: 1, suffix: 's' },
            { g: 'PUZZLE & MIND', id: 'memory', name: 'MEMORY', legacy: 'memoryBestMoves', lb: 1, suffix: ' moves' },
            { g: 'PUZZLE & MIND', id: 'g2048', name: '2048', legacy: 'g2048HighScore' },
            { g: 'PUZZLE & MIND', id: 'minesweeper', name: 'MINESWEEPER', legacy: 'minesweeperBestTime', lb: 1, suffix: 's' },
            { g: 'PUZZLE & MIND', id: 'tictactoe', name: 'TIC-TAC-TOE (X WINS)', legacy: 'tttXWins' },
            { g: 'PUZZLE & MIND', id: 'mathChallenge', name: 'MATH CHALLENGE', legacy: 'mathChallengeHighScore' },
            { g: 'PUZZLE & MIND', id: 'numberguess', name: 'NUMBER GUESS', legacy: 'numberGuessBest', lb: 1, suffix: ' tries' },
            { g: 'PUZZLE & MIND', id: 'clicker', name: 'CLICKER', legacy: 'clickerHighScore' },
            { g: 'PUZZLE & MIND', id: 'diceflip', name: 'DICE FLIP (WINS)', legacy: 'diceflipCoinWins' },
            { g: 'SKILL & ARCADE', id: 'reaction', name: 'REACTION TEST', legacy: 'reactionBestScore', lb: 1, suffix: 'ms' },
            { g: 'SKILL & ARCADE', id: 'tapDot', name: 'TAP THE DOT', legacy: 'tapDotHighScore' },
            { g: 'SKILL & ARCADE', id: 'shootingGallery', name: 'SHOOTING GALLERY', legacy: 'shootingGalleryHighScore' },
            { g: 'SKILL & ARCADE', id: 'colorMatch', name: 'COLOR MATCH', legacy: 'colorMatchBestLevel' },
            { g: 'SKILL & ARCADE', id: 'whackamole', name: 'WHACK-A-MOLE', legacy: 'whackamoleHighScore' },
            { g: 'SKILL & ARCADE', id: 'typingspeed', name: 'TYPE SPEED (WPM)', legacy: 'typingBestWpm' },
            { g: 'SKILL & ARCADE', id: 'barrelrun', name: 'BARREL RUN', legacy: 'barrelrunHighScore' },
            { g: 'ACTION', id: 'spaceinvaders', name: 'SPACE INVADERS', legacy: 'spaceinvadersHighScore' },
            { g: 'ACTION', id: 'asteroids', name: 'ASTEROIDS', legacy: 'asteroidsHighScore' },
            { g: 'ACTION', id: 'galaga', name: 'GALAGA', legacy: 'galagaHighScore' },
            { g: 'ACTION', id: 'missilecmd', name: 'MISSILE COMMAND', legacy: 'missilecmdHighScore' },
            { g: 'ACTION', id: 'digdug', name: 'DIG DUG', legacy: 'digdugHighScore' },
            { g: 'ACTION', id: 'centipede', name: 'CENTIPEDE', legacy: 'centipedeHighScore' },
            { g: 'ACTION', id: 'qbert', name: 'Q*BERT', legacy: 'qbertHighScore' },
            { g: 'ACTION', id: 'bomberman', name: 'BOMBERMAN', legacy: 'bombermanHighScore' },
            { g: 'ACTION', id: 'jezzball', name: 'JEZZBALL', legacy: 'jezzballHighScore' },
            { g: 'ACTION', id: 'moonpatrol', name: 'MOON PATROL', legacy: 'moonpatrolHighScore' },
            { g: 'ACTION', id: 'robotron', name: 'ROBOTRON: 2084', legacy: 'robotronHighScore' },
            { g: 'ACTION', id: 'burgerTime', name: 'BURGER TIME', legacy: 'burgerTimeHighScore' }
        ];

        var root = document.getElementById('groups');
        var groupOrder = ['CLASSIC', 'PUZZLE & MIND', 'SKILL & ARCADE', 'ACTION'];

        function fmt(g, v) { return v + (g.suffix || ''); }

        groupOrder.forEach(function (gn) {
            var sec = document.createElement('section');
            sec.className = 'rec-group';
            var h = document.createElement('h2');
            h.className = 'rec-group-title';
            h.textContent = gn;
            sec.appendChild(h);
            var wrap = document.createElement('div');
            wrap.className = 'rec-grid';
            GAMES.filter(function (x) { return x.g === gn; }).forEach(function (game) {
                var card = document.createElement('div');
                card.className = 'rec-card';
                var rows = '';
                var list = [];
                try { list = window.Scores.get(game.id) || []; } catch (e) {}
                list = list.filter(function (x) { return x && typeof x.s === 'number' && isFinite(x.s); });
                if (list.length) {
                    for (var i = 0; i < 5; i++) {
                        var e = list[i];
                        rows += '<div class="rec-row' + (i === 0 ? ' top' : '') + '">' +
                            '<span class="rk">#' + (i + 1) + '</span>' +
                            '<span class="ini">' + (e && typeof e.i === 'string' ? e.i : '···') + '</span>' +
                            '<span class="val">' + (e ? fmt(game, e.s.toLocaleString()) : '—') + '</span></div>';
                    }
                } else {
                    var legacy = 0;
                    try { legacy = parseInt(localStorage.getItem(game.legacy)) || 0; } catch (e) {}
                    rows = '<div class="rec-row legacy"><span class="rk">★</span><span class="ini">HI</span>' +
                        '<span class="val">' + (legacy ? fmt(game, legacy.toLocaleString()) : '—') + '</span></div>' +
                        '<div class="rec-row muted"><span class="rk"></span><span class="ini"></span>' +
                        '<span class="val small">beat it to join the table</span></div>';
                }
                card.innerHTML = '<div class="rec-name">' + game.name + '</div>' + rows;
                wrap.appendChild(card);
            });
            sec.appendChild(wrap);
            root.appendChild(sec);
        });

        document.getElementById('clearBtn').addEventListener('click', function () {
            if (!confirm('Clear ALL arcade records?')) return;
            var doomed = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && (k.indexOf('arcadeScores_') === 0 || /HighScore$|Best(Time|Moves|Score|Wpm|Level|Attempts)?$|XWins$|OWins$|Draws$|CoinWins$|TotalRolls$/.test(k))) doomed.push(k);
            }
            doomed.forEach(function (k) { localStorage.removeItem(k); });
            Sfx.play('die');
            location.reload();
        });
    })();
    </script>
</body>
</html>
